<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אלופפיצ'ר - הכתבות ומשחקי למידה</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body data-theme="soccer">

    <!-- מסך התחברות -->
    <div id="auth-screen" class="screen active">
        <div class="card auth-card">
            <h1>🎒 אלופפיצ'ר - עולם ההכתבות</h1>
            <p>תרגול הכתבות חכם וכיפי בעברית ובאנגלית עם דמויות וערכות נושא אהובות!</p>
            <div class="auth-buttons">
                <button id="google-login-btn" class="btn primary-btn">כניסה עם חשבון Google 🌐</button>
                <button id="guest-login-btn" class="btn secondary-btn">כניסה כאורח 👤</button>
            </div>
        </div>
    </div>

    <!-- מסך בחירת פרופיל וערכת נושא -->
    <div id="profile-screen" class="screen">
        <div class="container">
            <header class="main-header">
                <h2>בחר פרופיל ילד (עד 5)</h2>
                <div class="theme-selector">
                    <label>ערכת נושא:</label>
                    <select id="theme-select">
                        <option value="soccer">⚽ כדורגל</option>
                        <option value="minecraft">🟩 מיינקראפט</option>
                        <option value="fortnite">🎯 פורטנייט</option>
                        <option value="unicorn">🦄 יוניקורן</option>
                        <option value="stitch">💙 סטיץ' ואנג'ל</option>
                    </select>
                </div>
            </header>

            <div id="profiles-container" class="grid-container">
                <!-- פרופילים יטענו לכאן -->
            </div>

            <div class="add-profile-box">
                <input type="text" id="new-child-name" placeholder="שם הילד/ה...">
                <button id="add-child-btn" class="btn success-btn">הוסף ילד ➕</button>
            </div>

            <div class="parent-actions">
                <button id="open-parent-dashboard" class="btn dark-btn">⚙️ אזור ניהול הכתבות (הורים)</button>
            </div>
        </div>
    </div>

    <!-- מסך ניהול הכתבות להורים -->
    <div id="parent-screen" class="screen">
        <div class="container">
            <button id="back-to-profiles" class="btn secondary-btn">⬅ חזרה לבחירת פרופיל</button>
            <h2>ניהול הכתבות עבור: <span id="current-managing-child"></span></h2>
            
            <div class="card">
                <h3>הוספת הכתבה חדשה</h3>
                <form id="add-dictation-form">
                    <input type="text" id="dictation-title" placeholder="שם ההכתבה (למשל: מילים לאנגלית שיעור 3)" required>
                    <select id="dictation-lang">
                        <option value="he">עברית</option>
                        <option value="en">אנגלית</option>
                    </select>
                    <input type="date" id="dictation-date" required>
                    <textarea id="dictation-words" placeholder="הכנס מילים, מופרדות בפסיקים או שורה אחר שורה (למשל: cat, dog, apple)" rows="4" required></textarea>
                    <button type="submit" class="btn primary-btn">שמור הכתבה 💾</button>
                </form>
            </div>

            <div class="card">
                <h3>הכתבות קיימות</h3>
                <div id="existing-dictations-list"></div>
            </div>
        </div>
    </div>

    <!-- מסך תרגול הכתבה לילד -->
    <div id="practice-screen" class="screen">
        <div class="container">
            <button id="back-to-profiles-from-practice" class="btn secondary-btn">⬅ יציאה</button>
            <div class="practice-box card">
                <h2 id="practice-title-display">תרגול הכתבה</h2>
                <div class="progress-bar-container">
                    <div id="progress-bar" style="width: 0%;"></div>
                </div>
                <p id="practice-word-counter">מילה 1 מתוך 5</p>

                <div class="audio-controls">
                    <button id="speak-word-btn" class="btn primary-btn big-btn">🔊 שמע מילה</button>
                    <button id="fallback-audio-btn" class="btn warning-btn">🔔 צליל חלופי</button>
                </div>

                <div class="input-area">
                    <input type="text" id="user-typed-word" placeholder="הקלד את המילה כאן..." autocomplete="off">
                    <button id="submit-word-btn" class="btn success-btn">בדוק 🎯</button>
                </div>
                <p id="feedback-message"></p>
            </div>
        </div>
    </div>

    <!-- מסך סיכום וציונים -->
    <div id="results-screen" class="screen">
        <div class="container card text-center">
            <h2>🎉 כל הכבוד! סיימת את ההכתבה!</h2>
            <p id="final-score-text" class="big-text"></p>
            <div id="mistakes-review" class="mistakes-box"></div>
            <button id="restart-practice-btn" class="btn primary-btn">תרגל שוב 🔄</button>
            <button id="finish-practice-btn" class="btn secondary-btn">חזרה לתפריט הראשי 🏠</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
