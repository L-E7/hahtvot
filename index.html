<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אלופפיצ'ר - עולם ההכתבות</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4cd137">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body data-theme="soccer">

    <!-- מסך התחברות -->
    <div id="auth-screen" class="screen active">
        <div class="card auth-card">
            <h1>🎒 אלופפיצ'ר - עולם ההכתבות</h1>
            <p>תרגול הכתבות חכם וכיפי בעברית ובאנגלית לקראת המבחן של המורה!</p>
            <div class="auth-buttons">
                <button id="google-login-btn" class="btn primary-btn">כניסה עם חשבון Google 🌐</button>
                <button id="guest-login-btn" class="btn secondary-btn">כניסה כאורח 👤</button>
            </div>
        </div>
    </div>

    <!-- מסך בחירת פרופיל וערכת נושא -->
    <div id="profile-screen" class="screen">
        <div class="container">
            <header class="main-header">
                <h2>בחר פרופיל ילד (עד 5)</h2>
                <div class="theme-selector">
                    <label>ערכת נושא:</label>
                    <select id="theme-select">
                        <option value="soccer">⚽ כדורגל</option>
                        <option value="minecraft">🟩 מיינקראפט</option>
                        <option value="fortnite">🎯 פורטנייט</option>
                        <option value="unicorn">🦄 יוניקורן</option>
                        <option value="stitch">💙 סטיץ' ואנג'ל</option>
                    </select>
                </div>
            </header>

            <div id="profiles-container" class="grid-container"></div>

            <div class="add-profile-box">
                <input type="text" id="new-child-name" placeholder="שם הילד/ה...">
                <button id="add-child-btn" class="btn success-btn">הוסף ילד ➕</button>
            </div>
        </div>
    </div>

    <!-- מסך ניהול הכתבות להורים -->
    <div id="parent-screen" class="screen">
        <div class="container">
            <button id="back-to-profiles" class="btn secondary-btn">⬅ חזרה לבחירת פרופיל</button>
            <h2>ניהול הכתבות עבור: <span id="current-managing-child"></span></h2>
            
            <div class="card">
                <h3>הוספת הכתבה חדשה (הכנה למבחן)</h3>
                <form id="add-dictation-form">
                    <input type="text" id="dictation-title" placeholder="שם ההכתבה (למשל: חזרה למבחן - עמ' 37)" required>
                    <select id="dictation-lang">
                        <option value="he">עברית</option>
                        <option value="en">אנגלית</option>
                    </select>
                    <input type="date" id="dictation-date" required>
                    
                    <!-- בחירת מצב תרגול מיוחד -->
                    <div style="margin: 15px 0; text-align: right; background: #f1f2f6; padding: 10px; border-radius: 8px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #2d3436;">בחר סגנון תרגול להכתבה זו:</label>
                        <select id="practice-mode-select" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                            <option value="standard">רגיל (כתיבת המילה המלאה לפי שמיעה)</option>
                            <option value="challenge">אתגר אות ראשונה ואחרונה (האמצע גלוי)</option>
                            <option value="translation">מבחן תרגום (שמיעת מילה באנגלית וכתיבת הפירוש בעברית)</option>
                        </select>
                    </div>

                    <textarea id="dictation-words" placeholder="הכנס מילים בשורות נפרדות, עם או בלי מספור&#10;לדוגמה:&#10;1. apple - תפוח&#10;2. cat - חתול" rows="5" required></textarea>
                    <small style="display: block; color: #636e72; margin-bottom: 10px;">טיפ: הוסף תרגום עברית אחרי מקף (-) או פסיק, לדוגמה: `cat - חתול`</small>
                    <button type="submit" class="btn primary-btn">שמור הכתבה 💾</button>
                </form>
            </div>

            <div class="card">
                <h3>📅 בחר הכתבה לפי תאריך בלוח השנה</h3>
                <div class="calendar-filter-box" style="margin-bottom: 15px; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;">
                    <input type="date" id="calendar-date-picker" style="width: auto;">
                    <button id="filter-by-date-btn" class="btn primary-btn" style="padding: 10px 15px; font-size: 14px; margin: 0;">הצג לתאריך 🔍</button>
                    <button id="show-all-dictations-btn" class="btn secondary-btn" style="padding: 10px 15px; font-
